<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chord gitar dan lirik lagu lengkap dengan fitur transpose dan autoscroll di PowerChord." />
    <meta name="theme-color" content="#F97316" />
    <meta property="og:title" content="Chord & Lirik Lagu — PowerChord" />
    <meta property="og:description" content="Lihat chord gitar dan lirik lagu favoritmu. Transpose kunci dan autoscroll siap digunakan." />
    <meta property="og:type" content="website" />
    <title id="pageTitle">Chord & Lirik — PowerChord</title>
    <link rel="canonical" href="https://powerchord.pages.dev/" />
    <link rel="preload" href="css/style.css" as="style" />
    
    <!-- Preconnect untuk performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    
    <!-- Font Awesome dengan SRI -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" 
          integrity="sha384-5e2ESR8Ycmos6g3gAKr1Jvwye8sW4U1u/cAKulfVJnkakCcMqhOudbtPnvJ+nbv7" 
          crossorigin="anonymous" />
    
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/webp" href="asset/favicon.webp" />
</head>
<body>

    <div class="app-wrapper">
        <!-- DRAWER / SIDEBAR -->
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <aside class="drawer" id="drawer" role="navigation" aria-label="Navigasi utama">
            <div class="drawer-header">
                <img src="asset/PowerChord-logo.webp" alt="Logo PowerChord" class="logo-img" loading="lazy" />
                <div class="logo-text">Power<span>Chord</span></div>
                <button class="drawer-close" id="drawerClose" aria-label="Tutup menu">&times;</button>
            </div>
            <div class="drawer-search">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Cari lagu atau artis..." id="drawerSearchInput" />
                </div>
            </div>
            <nav class="drawer-nav">
                <a data-page="home" href="index.html"><i class="fas fa-home"></i> Beranda</a>
                <a data-page="library" href="#"><i class="fas fa-star"></i> Koleksi Saya</a>
                <a data-page="history" href="#"><i class="fas fa-clock"></i> Riwayat</a>
                <hr />
                <a data-page="settings" href="#"><i class="fas fa-sliders-h"></i> Pengaturan</a>
                <a data-page="about" href="#"><i class="fas fa-info-circle"></i> Tentang</a>
                <a data-page="request" href="#"><i class="fas fa-pen"></i> Request Chord</a>
            </nav>
            <div class="drawer-footer">v2.0 &bull; PowerChord</div>
        </aside>

        <!-- KONTEN UTAMA -->
        <div class="main-wrapper">
            <!-- HEADER -->
            <header class="header">
                <div class="container header-inner">
                    <button class="hamburger" aria-label="Buka menu" id="hamburgerBtn">☰</button>
                    <a href="index.html" class="logo" aria-label="PowerChord Home">
                        <img src="asset/PowerChord-logo.webp" alt="Logo PowerChord" class="logo-img" loading="lazy" />
                        <span>PowerChord</span>
                    </a>

                    <!-- Pencarian Header -->
                    <form id="headerSearchForm" class="header-search" role="search" action="index.html" method="get">
                        <label for="searchInput" class="visually-hidden">Cari chord</label>
                        <span aria-hidden="true">⌕</span>
                        <input type="search" id="searchInput" name="q" role="combobox" placeholder="🔍 Cari judul atau artis..." autocomplete="off" aria-controls="searchResults" aria-haspopup="listbox" aria-autocomplete="list" aria-expanded="false" aria-activedescendant="" />
                    </form>

                    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Aktifkan mode gelap" aria-pressed="false" title="Aktifkan mode gelap">
                        <span class="icon-moon" aria-hidden="true">🌙</span><span class="icon-sun" aria-hidden="true">☀️</span>
                    </button>
                </div>
            </header>

            <!-- KONTEN DETAIL -->
            <main class="container detail-layout">
                <!-- KOLOM UTAMA -->
                <section class="detail-primary">
                    <!-- Breadcrumb -->
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <a href="index.html">Beranda</a>
                        <span>›</span>
                        <span id="breadcrumbSong">Detail Lagu</span>
                    </nav>

                    <!-- Judul & Artis -->
                    <h1 id="judulLagu">Memuat...</h1>
                    <div class="detail-artist" id="artisLagu">—</div>

                    <!-- Meta -->
                    <div class="detail-meta">
                        <span id="difficulty">🎸 Pemula</span>
                        <span id="genre">Pop</span>
                        <span id="originalKey">Original key: C</span>
                    </div>

                    <!-- Control Bar (Transpose + Autoscroll) -->
                    <div class="control-bar">
                        <div class="transpose-box">
                            <span>Kunci:</span>
                            <button id="minus" aria-label="Turunkan kunci">−</button>
                            <span id="keyNow">C</span>
                            <button id="plus" aria-label="Naikkan kunci">+</button>
                            <button id="reset" aria-label="Reset kunci">↺</button>
                        </div>
                        <div class="autoscroll-box">
                            <button id="toggleScroll" class="btn-scroll" aria-pressed="false">▶ Autoscroll</button>
                            <div class="scroll-speed">
                                <button id="scrollSlow" aria-label="Perlambat autoscroll">−</button>
                                <span id="speedDisplay">1x</span>
                                <button id="scrollFast" aria-label="Percepat autoscroll">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Lirik & Chord -->
                    <div id="lirik" class="lirik-area" aria-live="polite">
                        <p class="loading-state">Memuat lirik…</p>
                    </div>
                </section>

                <!-- SIDEBAR KANAN (untuk halaman detail) -->
                <aside class="detail-sidebar" aria-label="Informasi tambahan">
                    <section class="sidebar-block" aria-labelledby="related-title">
                        <h2 id="related-title">🎵 Lagu Terkait</h2>
                        <div id="relatedSongs" class="sidebar-list">
                            <p class="loading-state">Memuat…</p>
                        </div>
                    </section>
                </aside>
            </main>

            <!-- Footer -->
            <footer class="footer" id="contact">
                <div class="container footer-inner">
                    <span>© 2026 PowerChord</span>
                    <nav aria-label="Tautan footer">
                        <a href="about.html">Tentang Kami</a>
                        <a href="contact.html">Kontak</a>
                        <a href="privacy.html">Privasi</a>
                        <a href="disclaimer.html">Disclaimer</a>
                        <a href="dmca.html">DMCA</a>
                    </nav>
                </div>
            </footer>
        </div>
    </div>

    <script type="module" src="js/main.js" defer></script>
</body>
</html>
