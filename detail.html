<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord & Lirik</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Terapkan tema sebelum render untuk mencegah FOUC
        (function () {
            var saved = null;
            try {
                saved = localStorage.getItem('theme');
            } catch (e) {
                // Gunakan preferensi sistem jika storage tidak tersedia.
            }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">← Kembali</a>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Aktifkan mode gelap" aria-pressed="false" title="Aktifkan mode gelap">
                <span class="icon-moon">🌙</span>
                <span class="icon-sun">☀️</span>
            </button>
        </div>
    </header>

    <main class="container detail-container">
        <h1 id="judulLagu">Komang</h1>
        <p id="artisLagu" class="detail-artist">Raim Laode</p>

        <!-- Transpose -->
        <div class="transpose-box">
            <button id="minus" type="button" aria-label="Turunkan kunci satu semitone">-</button>
            <span id="keyNow" aria-live="polite">G</span>
            <button id="plus" type="button" aria-label="Naikkan kunci satu semitone">+</button>
            <button id="reset" type="button">Reset</button>
        </div>

        <!-- Autoscroll -->
        <div class="autoscroll-box">
            <button id="toggleScroll" class="btn-scroll" type="button" aria-pressed="false">▶ Autoscroll</button>
            <div class="scroll-speed">
                <span id="speedLabel">Kecepatan:</span>
                <button id="scrollSlow" type="button" aria-label="Kurangi kecepatan autoscroll">-</button>
                <span id="speedDisplay" aria-live="polite">1x</span>
                <button id="scrollFast" type="button" aria-label="Tambah kecepatan autoscroll">+</button>
            </div>
        </div>

        <!-- Area Lirik & Chord -->
        <div class="lirik-area" id="lirik">
            <!-- Diisi oleh JavaScript -->
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
