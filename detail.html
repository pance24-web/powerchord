<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord & Lirik</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Terapkan tema sebelum render untuk mencegah FOUC
        (function () {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">← Kembali</a>
            <button id="themeToggle" class="theme-toggle" aria-label="Ganti mode terang/gelap" title="Ganti mode terang/gelap">
                <span class="icon-moon">🌙</span>
                <span class="icon-sun">☀️</span>
            </button>
        </div>
    </header>

    <main class="container detail-container">
        <h1 id="judulLagu">Komang</h1>
        <p id="artisLagu" class="detail-artist">Raim Laode</p>

        <!-- Transpose -->
        <div class="transpose-box">
            <button id="minus">-</button>
            <span id="keyNow">G</span>
            <button id="plus">+</button>
            <button id="reset">Reset</button>
        </div>

        <!-- Autoscroll -->
        <div class="autoscroll-box">
            <button id="toggleScroll" class="btn-scroll">▶ Autoscroll</button>
            <div class="scroll-speed">
                <span>Speed:</span>
                <button id="scrollSlow">-</button>
                <span id="speedDisplay">1x</span>
                <button id="scrollFast">+</button>
            </div>
        </div>

        <!-- Area Lirik & Chord -->
        <div class="lirik-area" id="lirik">
            <!-- Diisi oleh JavaScript -->
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
