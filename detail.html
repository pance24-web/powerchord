<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Lagu - PowerChord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">🎸 PowerChord</a></h1>
            <input type="text" id="search-input" placeholder="🔍 Cari judul atau artis..." onkeypress="if(event.key==='Enter')window.location.href='index.html?search='+this.value">
            <button id="dark-mode-toggle" style="background:none;border:none;font-size:24px;cursor:pointer;">🌙</button>
            <nav>
                <a href="index.html">🏠 Beranda</a>
                <a href="index.html">📚 Daftar Lagu</a>
                <a href="artists.html">🎤 Artis</a>
                <a href="#tentang">Tentang</a>
                <a href="#kontak">Kontak</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- BREADCRUMB (BARU) -->
        <div id="breadcrumb">
            <a href="index.html">🏠 Beranda</a>
            &gt; 
            <a href="artists.html" id="breadcrumb-artist">🎤 Artis</a>
            &gt; 
            <span id="breadcrumb-current">Judul Lagu</span>
        </div>

        <!-- DETAIL LAGU -->
        <div id="song-detail">
            <h1 id="song-title">Judul Lagu</h1>
            <p id="song-artist">Nama Artis</p>
            <span id="song-genre">🏷️ Genre</span>

            <!-- Kontrol Transpose & Autoscroll -->
            <div class="controls">
                <button id="transpose-down">⬇️ -1</button>
                <button id="transpose-reset" class="reset-btn">⟲ Reset</button>
                <button id="transpose-up">⬆️ +1</button>
                <span style="flex:1;"></span>
                <button id="autoscroll-toggle" class="reset-btn">▶️ Autoscroll</button>
            </div>

            <!-- Chord & Lirik -->
            <div id="chord-display">
                <i>Memuat chord...</i>
            </div>
        </div>

        <!-- STICKY BACK BUTTON (BARU) -->
        <div id="sticky-back">
            <button onclick="goBackToCatalog()" class="back-button">
                ⬅️ Kembali ke Daftar Lagu
            </button>
        </div>
    </main>

    <script>
        // Autoscroll sederhana
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('autoscroll-toggle');
            let scrollInterval = null;
            let isScrolling = false;

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    if (isScrolling) {
                        clearInterval(scrollInterval);
                        isScrolling = false;
                        this.textContent = '▶️ Autoscroll';
                        this.style.background = '#e0e0e0';
                        this.style.color = '#333';
                    } else {
                        this.textContent = '⏹️ Stop';
                        this.style.background = '#ff6b6b';
                        this.style.color = 'white';
                        isScrolling = true;
                        scrollInterval = setInterval(() => {
                            window.scrollBy(0, 30);
                        }, 800);
                    }
                });
            }
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
